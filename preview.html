<div class="game">
  <div class="dino">🦖</div>
  <div class="cactus">🌵</div>
</div>

<style>
.game {
  position: relative;
  width: 100%;
  height: 120px;
  overflow: hidden;
  background: #0d1117;
  border-bottom: 2px dashed #888;
}

.dino {
  position: absolute;
  left: 70px;
  bottom: 0;
  font-size: 40px;
  transform: scaleX(-1);
  z-index: 2;
}

.cactus {
  position: absolute;
  bottom: 0;
  left: 100%;
  font-size: 30px;
  animation: cactusMove 2.8s linear infinite;
}

@keyframes cactusMove {
  from { left: 100%; }
  to { left: -40px; }
}

.dino.jump {
  animation: dinoJump 850ms ease-in-out;
}

@keyframes dinoJump {
  0%   { bottom: 0; }
  40%  { bottom: 75px; }
  60%  { bottom: 75px; }
  100% { bottom: 0; }
}
</style>

<script>
const dino = document.querySelector(".dino");
const cactus = document.querySelector(".cactus");

let jumping = false;
let jumpedForThisCactus = false;

function gameLoop() {
  const dinoRect = dino.getBoundingClientRect();
  const cactusRect = cactus.getBoundingClientRect();

  const distance = cactusRect.left - dinoRect.right;

  // Jump when cactus is very close
  if (
    distance > 0 &&
    distance < 45 &&
    !jumping &&
    !jumpedForThisCactus
  ) {
    jumping = true;
    jumpedForThisCactus = true;

    dino.classList.add("jump");

    setTimeout(() => {
      dino.classList.remove("jump");
      jumping = false;
    }, 850);
  }

  // Reset after cactus passes
  if (cactusRect.right < dinoRect.left) {
    jumpedForThisCactus = false;
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
